name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble game assets
        run: |
          set -e
          DEST=android/app/src/main/assets/www
          rm -rf "$DEST"; mkdir -p "$DEST"
          cp index.html manifest.webmanifest "$DEST"/
          cp -r src styles data icons "$DEST"/
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp icons/icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          du -sh "$DEST"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordninja-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
